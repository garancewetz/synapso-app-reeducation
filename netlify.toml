[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Plugin Next.js pour Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"
  inputs = {}

# Variables d'environnement (à configurer dans le dashboard Netlify)
# DATABASE_URL - Connection string PostgreSQL
# SITE_PASSWORD - Mot de passe pour accéder au site


# L'ancienne adresse Netlify renvoie vers le domaine (redirection permanente, le chemin est gardé)
[[redirects]]
  from = "https://synapso.netlify.app/*"
  to = "https://synapso.garancewetz.dev/:splat"
  status = 301
  force = true
